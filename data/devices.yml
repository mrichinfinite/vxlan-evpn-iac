---
devices:

  S-1:
    role: spine

    loopbacks:
      loopback0:
        address: 10.0.0.11/32
        ospf: true
        pim: true

      loopback2:
        address: 10.1.1.11/32
        ospf: true
        pim: true
        purpose: multicast_rp

    ospf:
      router_id: 10.0.0.11

    bgp:
      router_id: 10.0.0.11
      update_source: loopback0
      neighbors:
        - address: 10.0.0.1
          remote_as: 65001
          role: route_reflector_client

        - address: 10.0.0.2
          remote_as: 65001
          role: route_reflector_client

    features:
      - ospf
      - pim
      - bgp
      - nv overlay


  L-1:
    role: leaf

    loopbacks:
      loopback0:
        address: 10.0.0.1/32
        ospf: true
        pim: true

      loopback1:
        address: 10.0.1.1/32
        ospf: true
        pim: true
        purpose: vtep_source

    ospf:
      router_id: 10.0.0.1

    bgp:
      router_id: 10.0.0.1
      update_source: loopback0
      neighbors:
        - address: 10.0.0.11
          remote_as: 65001
          role: route_reflector

    overlay:
      vlans:
        - 10
        - 30

      l3_vni:
        enabled: true

      svi:
        10:
          address: 192.168.10.254/24
          anycast_gateway: true
          tag: 12345

    features:
      - ospf
      - pim
      - bgp
      - nv overlay
      - vn-segment-vlan-based
      - fabric forwarding
      - interface-vlan


  L-2:
    role: leaf

    loopbacks:
      loopback0:
        address: 10.0.0.2/32
        ospf: true
        pim: true

      loopback1:
        address: 10.0.1.2/32
        ospf: true
        pim: true
        purpose: vtep_source

    ospf:
      router_id: 10.0.0.2

    bgp:
      router_id: 10.0.0.2
      update_source: loopback0
      neighbors:
        - address: 10.0.0.11
          remote_as: 65001
          role: route_reflector

    overlay:
      vlans:
        - 10
        - 20
        - 30

      l3_vni:
        enabled: true

      svi:
        10:
          address: 192.168.10.254/24
          anycast_gateway: true
          tag: 12345

        20:
          address: 192.168.20.254/24
          anycast_gateway: true

    features:
      - ospf
      - pim
      - bgp
      - nv overlay
      - vn-segment-vlan-based
      - fabric forwarding
      - interface-vlan