---
- name: Deploy required NX-OS features
  hosts: fabric
  gather_facts: false

  vars_files:
    - ../data/standards.yml

  roles:
    - role: 00_features

  post_tasks:
    - name: Save running configuration to startup configuration
      cisco.nxos.nxos_command:
        commands:
          - copy running-config startup-config
      changed_when: false
