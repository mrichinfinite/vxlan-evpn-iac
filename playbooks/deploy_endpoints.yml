---
- name: Deploy endpoint attachments
  hosts: leaves
  gather_facts: false

  vars_files:
    - ../data/standards.yml
    - ../data/fabric.yml
    - ../data/devices.yml
    - ../data/topology.yml

  roles:
    - role: 06_endpoints

  post_tasks:
    - name: Save running configuration to startup configuration
      cisco.nxos.nxos_command:
        commands:
          - copy running-config startup-config
      changed_when: false
