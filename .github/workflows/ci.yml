---
name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate Ansible
    runs-on:
      - self-hosted
      - linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Ansible dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -s requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if [ -s requirements.yml ]; then
            ansible-galaxy collection install -r requirements.yml
          fi

      - name: Check YAML syntax
        run: |
          python - <<'PY'
          import pathlib
          import yaml

          files = list(pathlib.Path(".").rglob("*.yml"))
          files += list(pathlib.Path(".").rglob("*.yaml"))

          for path in files:
              if ".git" in path.parts:
                  continue
              with path.open() as f:
                  yaml.safe_load(f)
              print(f"OK: {path}")
          PY

      - name: Check Ansible playbook syntax
        run: |
          ansible-playbook --syntax-check playbooks/deploy_features.yml
          ansible-playbook --syntax-check playbooks/validate_features.yml
