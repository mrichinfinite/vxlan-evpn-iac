---
- name: Validate Section 3 TENANT VRF and L3VNI
  hosts: leaves
  gather_facts: false

  vars_files:
    - ../../data/standards.yml
    - ../../data/fabric.yml
    - ../../data/devices.yml
    - ../../data/topology.yml

  tasks:

    - name: Gather TENANT VRF configuration
      cisco.nxos.nxos_command:
        commands:
          - "show running-config vrf {{ fabric.overlay.l3_vni.vrf }}"
      register: tenant_vrf
      changed_when: false

    - name: Validate TENANT VRF exists
      ansible.builtin.assert:
        that:
          - tenant_vrf.stdout[0] is search("vrf context " ~ fabric.overlay.l3_vni.vrf)
        fail_msg: >
          {{ fabric.overlay.l3_vni.vrf }} VRF is missing on
          {{ inventory_hostname }}.
        success_msg: >
          {{ fabric.overlay.l3_vni.vrf }} VRF is present on
          {{ inventory_hostname }}.

    - name: Validate TENANT L3VNI
      ansible.builtin.assert:
        that:
          - tenant_vrf.stdout[0] is search(
              "vni " ~ (fabric.overlay.l3_vni.vni | string)
            )
        fail_msg: >
          {{ fabric.overlay.l3_vni.vrf }} L3VNI
          {{ fabric.overlay.l3_vni.vni }} is missing on
          {{ inventory_hostname }}.
        success_msg: >
          {{ fabric.overlay.l3_vni.vrf }} L3VNI
          {{ fabric.overlay.l3_vni.vni }} is present on
          {{ inventory_hostname }}.

    - name: Validate TENANT RD
      ansible.builtin.assert:
        that:
          - tenant_vrf.stdout[0] is search("rd auto")
        fail_msg: >
          {{ fabric.overlay.l3_vni.vrf }} VRF RD auto is missing on
          {{ inventory_hostname }}.
        success_msg: >
          {{ fabric.overlay.l3_vni.vrf }} VRF RD auto is present on
          {{ inventory_hostname }}.

    - name: Validate TENANT IPv4 address family
      ansible.builtin.assert:
        that:
          - tenant_vrf.stdout[0] is search("address-family ipv4 unicast")
        fail_msg: >
          {{ fabric.overlay.l3_vni.vrf }} IPv4 unicast address family is
          missing on {{ inventory_hostname }}.
        success_msg: >
          {{ fabric.overlay.l3_vni.vrf }} IPv4 unicast address family is
          present on {{ inventory_hostname }}.

    - name: Validate EVPN route-target auto configuration
      ansible.builtin.assert:
        that:
          - tenant_vrf.stdout[0] is search("route-target both auto evpn")
        fail_msg: >
          {{ fabric.overlay.l3_vni.vrf }} EVPN route-target auto
          configuration is missing on {{ inventory_hostname }}.
        success_msg: >
          {{ fabric.overlay.l3_vni.vrf }} EVPN route-target auto
          configuration is correct on {{ inventory_hostname }}.

    - name: Gather L3VNI VLAN configuration
      cisco.nxos.nxos_command:
        commands:
          - "show running-config | section ^vlan.{{ fabric.overlay.l3_vni.vlan | int }}"
      register: l3vni_vlan_config
      changed_when: false

    - name: Validate L3VNI VLAN exists
      ansible.builtin.assert:
        that:
          - l3vni_vlan_config.stdout[0] is search(
              "vlan " ~ (fabric.overlay.l3_vni.vlan | string)
            )
        fail_msg: >
          L3VNI VLAN {{ fabric.overlay.l3_vni.vlan }} is missing on
          {{ inventory_hostname }}.
        success_msg: >
          L3VNI VLAN {{ fabric.overlay.l3_vni.vlan }} is present on
          {{ inventory_hostname }}.

    - name: Validate L3VNI VLAN mapping
      ansible.builtin.assert:
        that:
          - l3vni_vlan_config.stdout[0] is search(
              "vn-segment " ~ (fabric.overlay.l3_vni.vni | string)
            )
        fail_msg: >
          VLAN {{ fabric.overlay.l3_vni.vlan }} does not map to L3VNI
          {{ fabric.overlay.l3_vni.vni }} on {{ inventory_hostname }}.
        success_msg: >
          VLAN {{ fabric.overlay.l3_vni.vlan }} correctly maps to L3VNI
          {{ fabric.overlay.l3_vni.vni }} on {{ inventory_hostname }}.

    - name: Validate L3VNI SVI configuration
      cisco.nxos.nxos_command:
        commands:
          - "show running-config interface Vlan{{ fabric.overlay.l3_vni.vlan | int }}"
      register: l3vni_svi_config
      changed_when: false

    - name: Assert L3VNI SVI configuration
      ansible.builtin.assert:
        that:
          - >
            "interface Vlan"
            ~ (fabric.overlay.l3_vni.vlan | string)
            in l3vni_svi_config.stdout[0]
          - "'no shutdown' in l3vni_svi_config.stdout[0]"
          - >
            "vrf member "
            ~ fabric.overlay.l3_vni.vrf
            in l3vni_svi_config.stdout[0]
          - "'no ip redirects' in l3vni_svi_config.stdout[0]"
          - "'ip forward' in l3vni_svi_config.stdout[0]"
        fail_msg: >-
          L3VNI SVI Vlan{{ fabric.overlay.l3_vni.vlan | int }}
          does not match the intended L3VNI SVI configuration on
          {{ inventory_hostname }}.
        success_msg: >-
          L3VNI SVI Vlan{{ fabric.overlay.l3_vni.vlan | int }}
          is correctly configured on {{ inventory_hostname }}.

    - name: Gather L3VNI NVE configuration
      cisco.nxos.nxos_command:
        commands:
          - "show running-config | section ^interface.nve1"
      register: nve_config
      changed_when: false

    - name: Validate L3VNI NVE membership
      ansible.builtin.assert:
        that:
          - >
            nve_config.stdout[0] is search(
              "member vni "
              ~ (fabric.overlay.l3_vni.vni | string)
              ~ " associate-vrf"
            )
        fail_msg: >
          L3VNI {{ fabric.overlay.l3_vni.vni }} NVE membership is missing
          on {{ inventory_hostname }}.
        success_msg: >
          L3VNI {{ fabric.overlay.l3_vni.vni }} NVE membership is correct
          on {{ inventory_hostname }}.

    - name: Gather tenant route policy
      cisco.nxos.nxos_command:
        commands:
          - "show running-config | section ^route-map.TAGGED"
      register: tagged_route_map
      changed_when: false

    - name: Validate TAGGED route policy
      ansible.builtin.assert:
        that:
          - tagged_route_map.stdout[0] is search("route-map TAGGED permit 10")
          - tagged_route_map.stdout[0] is search("match tag 12345")
        fail_msg: >
          TAGGED route-map or tag 12345 match is missing on
          {{ inventory_hostname }}.
        success_msg: >
          TAGGED route policy correctly matches route tag 12345 on
          {{ inventory_hostname }}.

    - name: Gather TENANT BGP IPv4 redistribution configuration
      cisco.nxos.nxos_command:
        commands:
          - "show running-config | section router.bgp"
      register: bgp_config
      changed_when: false

    - name: Validate TENANT BGP VRF configuration
      ansible.builtin.assert:
        that:
          - bgp_config.stdout[0] is search(
              "vrf " ~ fabric.overlay.l3_vni.vrf
            )
        fail_msg: >
          BGP VRF {{ fabric.overlay.l3_vni.vrf }} configuration is missing
          on {{ inventory_hostname }}.
        success_msg: >
          BGP VRF {{ fabric.overlay.l3_vni.vrf }} configuration is present
          on {{ inventory_hostname }}.

    - name: Validate TENANT direct route redistribution
      ansible.builtin.assert:
        that:
          - >
            bgp_config.stdout[0] is search(
              "redistribute direct route-map TAGGED"
            )
        fail_msg: >
          TENANT direct route redistribution with TAGGED policy is missing
          on {{ inventory_hostname }}.
        success_msg: >
          TENANT direct routes are redistributed with TAGGED policy on
          {{ inventory_hostname }}.

    - name: Gather tenant SVI configuration
      cisco.nxos.nxos_command:
        commands:
          - "show running-config interface Vlan{{ item.key }}"
      loop: "{{ devices[inventory_hostname].overlay.svi | dict2items }}"
      register: svi_config
      changed_when: false
      loop_control:
        label: "Vlan{{ item.key }}"

    - name: Validate tenant SVI configuration
      ansible.builtin.assert:
        that:
          - >
            "interface Vlan"
            ~ (item.item.key | string)
            in item.stdout[0]
          - "'no shutdown' in item.stdout[0]"
          - >
            "vrf member "
            ~ fabric.overlay.l3_vni.vrf
            in item.stdout[0]
          - >
            "ip address "
            ~ item.item.value.address
            in item.stdout[0]
          - >
            (
              item.item.value.tag is not defined
            )
            or
            (
              "ip address "
              ~ item.item.value.address
              ~ " tag "
              ~ (item.item.value.tag | string)
              in item.stdout[0]
            )
          - >
            (
              item.item.value.anycast_gateway
              | default(false)
              | bool
            )
            ==
            (
              "fabric forwarding mode anycast-gateway"
              in item.stdout[0]
            )
        fail_msg: >
          Tenant SVI Vlan{{ item.item.key }} does not match the intended
          configuration on {{ inventory_hostname }}.
        success_msg: >
          Tenant SVI Vlan{{ item.item.key }} is correctly configured on
          {{ inventory_hostname }}.
      loop: "{{ svi_config.results }}"
      loop_control:
        label: "Vlan{{ item.item.key }}"

    - name: Gather anycast gateway MAC configuration
      cisco.nxos.nxos_command:
        commands:
          - show running-config | include "fabric forwarding anycast-gateway-mac"
      register: anycast_config
      changed_when: false

    - name: Validate anycast gateway MAC
      ansible.builtin.assert:
        that:
          - >
            anycast_config.stdout[0] is search(
              "fabric forwarding anycast-gateway-mac "
              ~ fabric.overlay.anycast_gateway_mac
            )
        fail_msg: >
          Anycast gateway MAC {{ fabric.overlay.anycast_gateway_mac }}
          is incorrect or missing on {{ inventory_hostname }}.
        success_msg: >
          Anycast gateway MAC {{ fabric.overlay.anycast_gateway_mac }}
          is correct on {{ inventory_hostname }}.

    - name: Section 3 validation complete
      ansible.builtin.debug:
        msg: >
          TENANT VRF, L3VNI, L3VNI VLAN, L3VNI SVI, NVE membership,
          redistribution, route policy, tenant SVIs, and anycast gateway
          validation passed on {{ inventory_hostname }}.
