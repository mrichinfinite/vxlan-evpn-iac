---
- name: Validate Section 2 Increment 4 SVI and anycast gateway
  hosts: leaves
  gather_facts: false

  vars_files:
    - ../../data/fabric.yml
    - ../../data/devices.yml
    - ../../data/topology.yml

  tasks:

    - name: Gather SVI interface configuration
      cisco.nxos.nxos_command:
        commands:
          - "show running-config interface Vlan{{ item }}"
      loop: "{{ devices[inventory_hostname].overlay.svi.keys() | list }}"
      register: svi_config
      changed_when: false
      loop_control:
        label: "Vlan{{ item }}"

    - name: Validate SVI VRF membership
      ansible.builtin.assert:
        that:
          - >-
            "vrf member " ~ fabric.overlay.l3_vni.vrf
            in item.stdout[0]
        fail_msg: >-
          Vlan{{ item.item }} is not assigned to VRF
          {{ fabric.overlay.l3_vni.vrf }} on {{ inventory_hostname }}.
        success_msg: >-
          Vlan{{ item.item }} is correctly assigned to VRF
          {{ fabric.overlay.l3_vni.vrf }} on {{ inventory_hostname }}.
      loop: "{{ svi_config.results }}"
      loop_control:
        label: "Vlan{{ item.item }}"

    - name: Validate SVI IPv4 addresses
      ansible.builtin.assert:
        that:
          - >-
            "ip address "
            ~ devices[inventory_hostname].overlay.svi[item.item].address
            in item.stdout[0]
        fail_msg: >-
          Vlan{{ item.item }} does not have the expected IPv4 address
          {{ devices[inventory_hostname].overlay.svi[item.item].address }}
          on {{ inventory_hostname }}.
        success_msg: >-
          Vlan{{ item.item }} has the expected IPv4 address
          {{ devices[inventory_hostname].overlay.svi[item.item].address }}
          on {{ inventory_hostname }}.
      loop: "{{ svi_config.results }}"
      loop_control:
        label: "Vlan{{ item.item }}"

    - name: Validate SVI anycast gateway mode
      ansible.builtin.assert:
        that:
          - >-
            (
              devices[inventory_hostname].overlay.svi[item.item].anycast_gateway
              | default(false)
              | bool
            )
            == (
              "fabric forwarding mode anycast-gateway" in item.stdout[0]
            )
        fail_msg: >-
          Vlan{{ item.item }} has an unexpected anycast gateway state
          on {{ inventory_hostname }}.
        success_msg: >-
          Vlan{{ item.item }} has the expected anycast gateway state
          on {{ inventory_hostname }}.
      loop: "{{ svi_config.results }}"
      loop_control:
        label: "Vlan{{ item.item }}"

    - name: Validate SVI IPv4 tag
      ansible.builtin.assert:
        that:
          - >-
            (
              devices[inventory_hostname].overlay.svi[item.item].tag is not defined
            )
            or
            (
              "ip address "
              ~ devices[inventory_hostname].overlay.svi[item.item].address
              ~ " tag "
              ~ (devices[inventory_hostname].overlay.svi[item.item].tag | string)
              in item.stdout[0]
            )
        fail_msg: >-
          Vlan{{ item.item }} does not have the expected IPv4 tag
          on {{ inventory_hostname }}.
        success_msg: >-
          Vlan{{ item.item }} has the expected IPv4 tag state
          on {{ inventory_hostname }}.
      loop: "{{ svi_config.results }}"
      loop_control:
        label: "Vlan{{ item.item }}"

    - name: Gather global anycast gateway configuration
      cisco.nxos.nxos_command:
        commands:
          - show running-config
      register: anycast_gateway_config
      changed_when: false

    - name: Validate global anycast gateway MAC
      ansible.builtin.assert:
        that:
          - >-
            "fabric forwarding anycast-gateway-mac "
            ~ fabric.overlay.anycast_gateway_mac
            in anycast_gateway_config.stdout[0]
        fail_msg: >-
          Global anycast gateway MAC is not configured as expected on
          {{ inventory_hostname }}.
        success_msg: >-
          Global anycast gateway MAC
          {{ fabric.overlay.anycast_gateway_mac }}
          is correctly configured on {{ inventory_hostname }}.

    - name: Increment 4 validation complete
      ansible.builtin.debug:
        msg:
          - "Section 2 Increment 4 validation passed."
          - "SVIs, VRF membership, IPv4 addressing, IPv4 tags, anycast gateway mode, and global anycast gateway MAC are correct."