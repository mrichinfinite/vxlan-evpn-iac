---
- name: Validate Overlay VLANs
  hosts: leaves
  gather_facts: false

  vars_files:
    - ../../data/fabric.yml
    - ../../data/devices.yml

  tasks:

    - name: Gather VLAN configuration
      cisco.nxos.nxos_vlans:
        state: gathered
      register: gathered_vlans

    - name: Validate required overlay VLANs
      ansible.builtin.assert:
        that:
          - item | int in (gathered_vlans.gathered | map(attribute='vlan_id') | map('int') | list)
        fail_msg: "VLAN {{ item }} is missing on {{ inventory_hostname }}."
        success_msg: "VLAN {{ item }} is present on {{ inventory_hostname }}."
      loop: "{{ devices[inventory_hostname].overlay.vlans }}"
      loop_control:
        label: "{{ item }}"

    - name: Validate overlay VLAN names
      ansible.builtin.assert:
        that:
          - >
            (
              gathered_vlans.gathered
              | selectattr('vlan_id', 'equalto', item | int)
              | map(attribute='name')
              | list
              | first
            ) == fabric.overlay.vlans[item].name
        fail_msg: "VLAN {{ item }} has an unexpected name on {{ inventory_hostname }}."
        success_msg: "VLAN {{ item }} has the expected name on {{ inventory_hostname }}."
      loop: "{{ devices[inventory_hostname].overlay.vlans }}"
      loop_control:
        label: "{{ item }}"

    - name: Section 2 VLAN validation complete
      ansible.builtin.debug:
        msg: "Overlay VLAN validation passed on {{ inventory_hostname }}."

- name: Validate VLAN to VNI mappings and EVPN L2 VNIs
  hosts: leaves
  gather_facts: false

  vars_files:
    - ../../data/fabric.yml
    - ../../data/devices.yml

  tasks:

    - name: Gather VLAN configuration
      cisco.nxos.nxos_vlans:
        state: gathered
      register: gathered_vlans

    - name: Validate VLAN to VNI mappings
      ansible.builtin.assert:
        that:
          - >
            (
              gathered_vlans.gathered
              | selectattr('vlan_id', 'equalto', item | int)
              | map(attribute='mapped_vni')
              | map('int')
              | list
              | first
            ) == (fabric.overlay.vlans[item].vni | int)
        fail_msg: >
          VLAN {{ item }} does not map to VNI
          {{ fabric.overlay.vlans[item].vni }} on {{ inventory_hostname }}.
        success_msg: >
          VLAN {{ item }} correctly maps to VNI
          {{ fabric.overlay.vlans[item].vni }} on {{ inventory_hostname }}.
      loop: "{{ devices[inventory_hostname].overlay.vlans }}"
      loop_control:
        label: "VLAN {{ item }} -> VNI {{ fabric.overlay.vlans[item].vni }}"

    - name: Gather EVPN configuration
      cisco.nxos.nxos_command:
        commands:
          - "show running-config | section ^evpn"
      register: evpn_config

    - name: Validate EVPN L2VNI configuration
      ansible.builtin.assert:
        that:
          - "'vni ' ~ (fabric.overlay.vlans[item].vni | string) ~ ' l2' in evpn_config.stdout[0]"
          - "'rd auto' in evpn_config.stdout[0]"
          - "'route-target import auto' in evpn_config.stdout[0]"
          - "'route-target export auto' in evpn_config.stdout[0]"
        fail_msg: >
          EVPN L2VNI {{ fabric.overlay.vlans[item].vni }}
          is not correctly configured on {{ inventory_hostname }}.
        success_msg: >
          EVPN L2VNI {{ fabric.overlay.vlans[item].vni }}
          is correctly configured on {{ inventory_hostname }}.
      loop: "{{ devices[inventory_hostname].overlay.vlans }}"
      when:
        - item | int != fabric.overlay.l3_vni.vlan | int
      loop_control:
        label: "EVPN L2VNI {{ fabric.overlay.vlans[item].vni }}"

    - name: Validate L3VNI is not configured as L2 EVPN VNI
      ansible.builtin.assert:
        that:
          - "'vni ' ~ (fabric.overlay.l3_vni.vni | string) ~ ' l2' not in evpn_config.stdout[0]"
        fail_msg: >
          L3VNI {{ fabric.overlay.l3_vni.vni }}
          was incorrectly configured as an L2 EVPN VNI on {{ inventory_hostname }}.
        success_msg: >
          L3VNI {{ fabric.overlay.l3_vni.vni }}
          is correctly reserved for the L3 overlay.

    - name: Section 2 Increment 2 validation complete
      ansible.builtin.debug:
        msg: >
          VLAN-to-VNI mappings and EVPN L2 VNIs validated successfully
          on {{ inventory_hostname }}.

- name: Validate SVI and anycast gateway
  hosts: leaves
  gather_facts: false

  vars_files:
    - ../../data/fabric.yml
    - ../../data/devices.yml
    - ../../data/topology.yml

  tasks:

    - name: Gather SVI interface configuration
      cisco.nxos.nxos_command:
        commands:
          - "show running-config interface Vlan{{ item }}"
      loop: "{{ devices[inventory_hostname].overlay.svi.keys() | list }}"
      register: svi_config
      changed_when: false
      loop_control:
        label: "Vlan{{ item }}"

    - name: Validate SVI VRF membership
      ansible.builtin.assert:
        that:
          - >-
            "vrf member " ~ fabric.overlay.l3_vni.vrf
            in item.stdout[0]
        fail_msg: >-
          Vlan{{ item.item }} is not assigned to VRF
          {{ fabric.overlay.l3_vni.vrf }} on {{ inventory_hostname }}.
        success_msg: >-
          Vlan{{ item.item }} is correctly assigned to VRF
          {{ fabric.overlay.l3_vni.vrf }} on {{ inventory_hostname }}.
      loop: "{{ svi_config.results }}"
      loop_control:
        label: "Vlan{{ item.item }}"

    - name: Validate SVI IPv4 addresses
      ansible.builtin.assert:
        that:
          - >-
            "ip address "
            ~ devices[inventory_hostname].overlay.svi[item.item].address
            in item.stdout[0]
        fail_msg: >-
          Vlan{{ item.item }} does not have the expected IPv4 address
          {{ devices[inventory_hostname].overlay.svi[item.item].address }}
          on {{ inventory_hostname }}.
        success_msg: >-
          Vlan{{ item.item }} has the expected IPv4 address
          {{ devices[inventory_hostname].overlay.svi[item.item].address }}
          on {{ inventory_hostname }}.
      loop: "{{ svi_config.results }}"
      loop_control:
        label: "Vlan{{ item.item }}"

    - name: Validate SVI anycast gateway mode
      ansible.builtin.assert:
        that:
          - >-
            (
              devices[inventory_hostname].overlay.svi[item.item].anycast_gateway
              | default(false)
              | bool
            )
            == (
              "fabric forwarding mode anycast-gateway" in item.stdout[0]
            )
        fail_msg: >-
          Vlan{{ item.item }} has an unexpected anycast gateway state
          on {{ inventory_hostname }}.
        success_msg: >-
          Vlan{{ item.item }} has the expected anycast gateway state
          on {{ inventory_hostname }}.
      loop: "{{ svi_config.results }}"
      loop_control:
        label: "Vlan{{ item.item }}"

    - name: Validate SVI IPv4 tag
      ansible.builtin.assert:
        that:
          - >-
            (
              devices[inventory_hostname].overlay.svi[item.item].tag is not defined
            )
            or
            (
              "ip address "
              ~ devices[inventory_hostname].overlay.svi[item.item].address
              ~ " tag "
              ~ (devices[inventory_hostname].overlay.svi[item.item].tag | string)
              in item.stdout[0]
            )
        fail_msg: >-
          Vlan{{ item.item }} does not have the expected IPv4 tag
          on {{ inventory_hostname }}.
        success_msg: >-
          Vlan{{ item.item }} has the expected IPv4 tag state
          on {{ inventory_hostname }}.
      loop: "{{ svi_config.results }}"
      loop_control:
        label: "Vlan{{ item.item }}"

    - name: Gather global anycast gateway configuration
      cisco.nxos.nxos_command:
        commands:
          - show running-config
      register: anycast_gateway_config
      changed_when: false

    - name: Validate global anycast gateway MAC
      ansible.builtin.assert:
        that:
          - >-
            "fabric forwarding anycast-gateway-mac "
            ~ fabric.overlay.anycast_gateway_mac
            in anycast_gateway_config.stdout[0]
        fail_msg: >-
          Global anycast gateway MAC is not configured as expected on
          {{ inventory_hostname }}.
        success_msg: >-
          Global anycast gateway MAC
          {{ fabric.overlay.anycast_gateway_mac }}
          is correctly configured on {{ inventory_hostname }}.

    - name: Increment 4 validation complete
      ansible.builtin.debug:
        msg:
          - "Section 2 Increment 4 validation passed."
          - "SVIs, VRF membership, IPv4 addressing, IPv4 tags, anycast gateway mode, and global anycast gateway MAC are correct."