---
- name: Configure OSPF process
  cisco.nxos.nxos_ospfv2:
    config:
      processes:
        - process_id: "{{ fabric.underlay.ospf.process }}"
          router_id: "{{ devices[inventory_hostname].ospf.router_id }}"

- name: Enable OSPF on loopback interfaces
  cisco.nxos.nxos_ospf_interfaces:
    config:
      - name: "{{ item.key }}"
        address_family:
          - afi: ipv4
            processes:
              - process_id: "{{ fabric.underlay.ospf.process }}"
                area:
                  area_id: "{{ fabric.underlay.ospf.area }}"
                  secondaries: false
  loop: "{{ devices[inventory_hostname].loopbacks | dict2items }}"
  when: item.value.ospf | default(false) | bool
  loop_control:
    label: "{{ item.key }}"

- name: Enable OSPF on fabric interfaces
  cisco.nxos.nxos_ospf_interfaces:
    config:
      - name: "{{ item.local_interface if item.local_device == inventory_hostname else item.remote_interface }}"
        address_family:
          - afi: ipv4
            processes:
              - process_id: "{{ fabric.underlay.ospf.process }}"
                area:
                  area_id: "{{ fabric.underlay.ospf.area }}"
                  secondaries: false
  loop: "{{ topology.fabric_links }}"
  when:
    - inventory_hostname == item.local_device or inventory_hostname == item.remote_device
  loop_control:
    label: >-
      {{ item.local_interface if item.local_device == inventory_hostname
         else item.remote_interface }}
